[project]
name = "fast-api-wasm-python"
version = "0.1.0"
description = "FastAPI development template for Dev Containers and Codex CLI."
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "wasmtime (>=44.0.0,<45.0.0)",
]

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.group.dev.dependencies]
pytest = "8.3.4"
httpx = "0.28.1"
ruff = "0.8.4"
black = "24.10.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
